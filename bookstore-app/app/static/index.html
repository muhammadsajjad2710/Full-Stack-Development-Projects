<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookstore</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Full stack</p>
    <h1>Bookstore</h1>
    <p class="lede">Add books and search the catalog.</p>
    <form id="form"><div class="row"><input id="title" required placeholder="Title"><input id="author" required placeholder="Author"><input id="year" type="number" required value="1965"></div><button type="submit">Add book</button></form><form id="search" class="row"><input id="q" placeholder="Search"><button type="submit" class="secondary">Search</button></form>
    <ul id="list" class="list"></ul>
    <p id="status" class="status" role="status"></p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
