<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Book</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Full stack</p>
    <h1>Recipe Book</h1>
    <p class="lede">Save recipes with ingredients and steps.</p>
    <form id="form"><input id="title" required placeholder="Recipe name"><textarea id="ingredients" required placeholder="Ingredients"></textarea><textarea id="steps" required placeholder="Steps"></textarea><button type="submit">Save recipe</button></form>
    <ul id="list" class="list"></ul>
    <p id="status" class="status" role="status"></p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
