<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo App</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Full stack</p>
    <h1>Todo App</h1>
    <p class="lede">Add tasks and mark them done. FastAPI backend plus a browser UI.</p>
    <form id="form" class="row"><input id="title" name="title" required placeholder="Task"><button type="submit">Add</button></form>
    <ul id="list" class="list"></ul>
    <p id="status" class="status" role="status"></p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
