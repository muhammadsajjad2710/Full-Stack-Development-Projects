<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog App</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Full stack</p>
    <h1>Blog App</h1>
    <p class="lede">Publish posts and add comments.</p>
    <form id="form"><input id="title" required placeholder="Post title"><textarea id="body" required placeholder="Body"></textarea><button type="submit">Publish</button></form>
    <ul id="list" class="list"></ul>
    <p id="status" class="status" role="status"></p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
